<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ebalo.id</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Шапка */
        header {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            background-color: #121212;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #76b900;
            margin-right: 40px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            color: #76b900;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding-bottom: 4px;
            border-bottom: 2px solid #76b900;
        }

        /* Лента */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #242424;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333333;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
        }

        .video-container div {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .card-info {
            padding: 15px;
        }

        .card-user {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #aaaaaa;
        }

        .user-name {
            color: #ffffff;
            font-weight: 600;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #888888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><span>🐸</span> ebalo.id</a>
        <nav><a href="#">Лента</a></nav>
    </header>

    <main class="container">
        <div class="feed-grid">
            <div class="card">
                <div class="video-container">
                    <div id="player"></div>
                </div>
                <div class="card-info">
                    <div class="card-user">
                        <span class="user-name">user</span>
                        <span>сегодня</span>
                    </div>
                    <div class="card-title">Видеозапись</div>
                    <div class="card-stats">
                        <span>👁 100</span>
                        <span>❤️ 15</span>
                        <span>💬 3</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Подключаем API YouTube -->
    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'iztO22wM9dI',
                playerVars: {
                    'origin': window.location.origin || 'http://localhost'
                }
            });
        }
    </script>
</body>
</html>
