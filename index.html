<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ebalo.id</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Шапка */
        header {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            background-color: #121212;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #76b900;
            margin-right: 40px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #333;
        }

        nav a {
            color: #76b900;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding-bottom: 4px;
            border-bottom: 2px solid #76b900;
        }

        /* Контейнер */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Форма добавления видео */
        .publish-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background-color: #242424;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333333;
        }

        .publish-input {
            flex: 1;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .publish-input:focus {
            border-color: #76b900;
        }

        .publish-btn {
            padding: 12px 24px;
            background-color: #76b900;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .publish-btn:hover {
            background-color: #8ce000;
        }

        /* Лента */
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* Карточка */
        .card {
            background-color: #242424;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333333;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* Превью 16:9 */
        .thumb-wrapper {
            display: block;
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
            text-decoration: none;
        }

        .thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Кнопка Play */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 48px;
            background-color: rgba(255, 0, 0, 0.85);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            z-index: 2;
        }

        .thumb-wrapper:hover .play-btn {
            background-color: #ff0000;
        }

        .play-btn::after {
            content: "";
            border-style: solid;
            border-width: 9px 0 9px 16px;
            border-color: transparent transparent transparent #ffffff;
        }

        /* Инфо о посте */
        .card-info {
            padding: 15px;
        }

        .card-user {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #aaaaaa;
        }

        .user-name {
            color: #ffffff;
            font-weight: 600;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <img 
                src="https://i.pinimg.com/736x/12/69/82/1269823620ab6546fba9644d1f741193.jpg" 
                alt="Логотип" 
                class="logo-img"
            >
            ebalo.id
        </a>
        <nav><a href="#">Лента</a></nav>
    </header>

    <main class="container">
        <!-- Форма для вставки ссылки -->
        <div class="publish-form">
            <input 
                type="text" 
                id="youtubeUrl" 
                class="publish-input" 
                placeholder="Вставьте ссылку на YouTube видео..."
            >
            <button class="publish-btn" onclick="addVideo()">Опубликовать</button>
        </div>

        <!-- Лента карточек -->
        <div class="feed-grid" id="feedGrid">
            <!-- Первое видео -->
            <div class="card">
                <a href="https://www.youtube.com/watch?v=iztO22wM9dI" target="_blank" class="thumb-wrapper">
                    <img src="https://img.youtube.com/vi/iztO22wM9dI/hqdefault.jpg" alt="Превью" class="thumb-img">
                    <div class="play-btn"></div>
                </a>
                <div class="card-info">
                    <div class="card-user">
                        <span class="user-name">user</span>
                        <span>сегодня</span>
                    </div>
                    <div class="card-title">Видеозапись</div>
                </div>
            </div>

            <!-- Второе видео -->
            <div class="card">
                <a href="https://www.youtube.com/watch?v=jSDCHwrz1Lo" target="_blank" class="thumb-wrapper">
                    <img src="https://img.youtube.com/vi/jSDCHwrz1Lo/hqdefault.jpg" alt="Превью" class="thumb-img">
                    <div class="play-btn"></div>
                </a>
                <div class="card-info">
                    <div class="card-user">
                        <span class="user-name">user</span>
                        <span>сегодня</span>
                    </div>
                    <div class="card-title">Видеозапись</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Функция извлечения ID видео из ссылки YouTube
        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Функция добавления нового видео в ленту
        function addVideo() {
            const input = document.getElementById('youtubeUrl');
            const url = input.value.trim();
            const videoId = extractVideoId(url);

            if (!videoId) {
                alert('Пожалуйста, вставьте корректную ссылку на YouTube!');
                return;
            }

            const feedGrid = document.getElementById('feedGrid');

            // Создаем новую карточку
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank" class="thumb-wrapper">
                    <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" alt="Превью" class="thumb-img">
                    <div class="play-btn"></div>
                </a>
                <div class="card-info">
                    <div class="card-user">
                        <span class="user-name">user</span>
                        <span>только что</span>
                    </div>
                    <div class="card-title">Видеозапись</div>
                </div>
            `;

            // Добавляем новое видео в начало ленты
            feedGrid.prepend(card);

            // Очищаем поле ввода
            input.value = '';
        }
    </script>

</body>
</html>
