<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ebalo.id</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Шапка */
        header {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            background-color: #121212;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #76b900;
            margin-right: 40px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            color: #76b900;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding-bottom: 4px;
            border-bottom: 2px solid #76b900;
        }

        /* Лента */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* Карточка */
        .card {
            background-color: #242424;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333333;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* Превью карточки в нормальном пропорции 16:9 */
        .thumb-wrapper {
            display: block;
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Пропорция 16:9 */
            background-color: #000;
            text-decoration: none;
        }

        .thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Кнопка Play по центру */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 48px;
            background-color: rgba(255, 0, 0, 0.85);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .thumb-wrapper:hover .play-btn {
            background-color: #ff0000;
        }

        .play-btn::after {
            content: "";
            border-style: solid;
            border-width: 9px 0 9px 16px;
            border-color: transparent transparent transparent #ffffff;
        }

        /* Текст под видео */
        .card-info {
            padding: 15px;
        }

        .card-user {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #aaaaaa;
        }

        .user-name {
            color: #ffffff;
            font-weight: 600;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo"><span>🐸</span> ebalo.id</a>
        <nav><a href="#">Лента</a></nav>
    </header>

    <main class="container">
        <div class="feed-grid">
            <div class="card">
                <!-- Прямая ссылка на видео без фреймов -->
                <a href="https://www.youtube.com/watch?v=iztO22wM9dI" target="_blank" class="thumb-wrapper">
                    <img src="https://img.youtube.com/vi/iztO22wM9dI/maxresdefault.jpg" alt="Превью" class="thumb-img">
                    <div class="play-btn"></div>
                </a>
                
                <div class="card-info">
                    <div class="card-user">
                        <span class="user-name">user</span>
                        <span>сегодня</span>
                    </div>
                    <div class="card-title">Видеозапись</div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
