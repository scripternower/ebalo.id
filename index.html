<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ebalo.id</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            background-color: #121212;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #76b900;
            margin-right: 40px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #333;
        }

        nav a {
            color: #76b900;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding-bottom: 4px;
            border-bottom: 2px solid #76b900;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .publish-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background-color: #242424;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #333333;
        }

        .publish-input {
            flex: 1;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .publish-input:focus {
            border-color: #76b900;
        }

        .publish-btn {
            padding: 12px 24px;
            background-color: #76b900;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .publish-btn:hover {
            background-color: #8ce000;
        }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #242424;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333333;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .thumb-wrapper {
            display: block;
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background-color: #000;
            text-decoration: none;
        }

        .thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 48px;
            background-color: rgba(255, 0, 0, 0.85);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            z-index: 2;
        }

        .thumb-wrapper:hover .play-btn {
            background-color: #ff0000;
        }

        .play-btn::after {
            content: "";
            border-style: solid;
            border-width: 9px 0 9px 16px;
            border-color: transparent transparent transparent #ffffff;
        }

        .card-info {
            padding: 15px;
        }

        .card-user {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #aaaaaa;
        }

        .user-name {
            color: #ffffff;
            font-weight: 600;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .error-msg {
            color: #ff4d4d;
            background: #2a1515;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #552222;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">
            <img src="https://i.pinimg.com/736x/12/69/82/1269823620ab6546fba9644d1f741193.jpg" alt="Лого" class="logo-img">
            ebalo.id
        </a>
        <nav><a href="#">Лента</a></nav>
    </header>

    <main class="container">
        <div class="publish-form">
            <input 
                type="text" 
                id="youtubeUrl" 
                class="publish-input" 
                placeholder="Вставьте ссылку на YouTube видео..."
            >
            <button class="publish-btn" onclick="addVideo()">Опубликовать</button>
        </div>

        <div class="feed-grid" id="feedGrid">Загрузка видео...</div>
    </main>

    <script>
        const SUPABASE_URL = 'https://kduxsliyemnrztewagaz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdXhzbGl5ZW1ucnp0ZXdhZ2F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTkwMjUsImV4cCI6MjEwMDg5NTAyNX0.xA2aWGA1qbfPTGNIYaD0W1x5o6H32OcCR-_-9TBHqDs';

        let db;

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof supabase !== 'undefined') {
                db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                fetchVideos();
            } else {
                document.getElementById('feedGrid').innerHTML = 
                    '<div class="error-msg">Ошибка: Библиотека Supabase не загрузилась!</div>';
            }
        });

        async function fetchVideos() {
            const feedGrid = document.getElementById('feedGrid');

            try {
                const { data, error } = await db
                    .from('videos')
                    .select('*');

                if (error) {
                    console.error('Ошибка Supabase:', error);
                    feedGrid.innerHTML = `
                        <div class="error-msg">
                            <b>Ошибка базы данных:</b> ${error.message}<br>
                            Убедись, что создана таблица 'videos' и отключен RLS!
                        </div>
                    `;
                    return;
                }

                if (!data || data.length === 0) {
                    feedGrid.innerHTML = '<p style="color: #aaa;">Лента пока пуста. Опубликуй первое видео!</p>';
                    return;
                }

                renderFeed([...data].reverse());
            } catch (err) {
                feedGrid.innerHTML = `<div class="error-msg"><b>Ошибка скрипта:</b> ${err.message}</div>`;
            }
        }

        function renderFeed(videos) {
            const feedGrid = document.getElementById('feedGrid');
            feedGrid.innerHTML = '';

            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <a href="https://www.youtube.com/watch?v=${video.youtube_id}" target="_blank" class="thumb-wrapper">
                        <img src="https://img.youtube.com/vi/${video.youtube_id}/hqdefault.jpg" alt="Превью" class="thumb-img">
                        <div class="play-btn"></div>
                    </a>
                    <div class="card-info">
                        <div class="card-user">
                            <span class="user-name">${video.user_name || 'user'}</span>
                            <span>сегодня</span>
                        </div>
                        <div class="card-title">Видеозапись</div>
                    </div>
                `;
                feedGrid.appendChild(card);
            });
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function addVideo() {
            const input = document.getElementById('youtubeUrl');
            const url = input.value.trim();
            const videoId = extractVideoId(url);

            if (!videoId) {
                alert('Вставьте корректную ссылку на YouTube!');
                return;
            }

            const { error } = await db
                .from('videos')
                .insert([{ youtube_id: videoId, user_name: 'user' }]);

            if (error) {
                alert('Ошибка при публикации: ' + error.message);
                console.error(error);
            } else {
                input.value = '';
                fetchVideos();
            }
        }
    </script>

</body>
</html>
