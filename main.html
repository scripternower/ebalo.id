<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ebalo.id</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Шапка сайта */
        header {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            background-color: #121212;
            border-bottom: 1px solid #2a2a2a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #76b900;
            margin-right: 40px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #76b900;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding-bottom: 4px;
            border-bottom: 2px solid #76b900;
        }

        /* Контейнер ленты */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Сетка постов */
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        /* Карточка поста */
        .card {
            background-color: #242424;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333333;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Соотношение сторон 16:9 */
            background-color: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .card-info {
            padding: 15px;
        }

        .card-user {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: #aaaaaa;
        }

        .user-name {
            color: #ffffff;
            font-weight: 600;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .card-stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            color: #888888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <a href="#" class="logo">
            <span>🐸</span> ebalo.id
        </a>
        <nav>
            <a href="#">Лента</a>
        </nav>
    </header>

    <!-- Основная лента -->
    <main class="container">
        <div class="feed-grid">

            <!-- Карточка с видео -->
            <div class="card">
                <div class="video-container">
                    <iframe 
                        src="https://www.youtube-nocookie.com/embed/iztO22wM9dI" 
                        title="YouTube video player" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                    </iframe>
                </div>
                <div class="card-info">
                    <div class="card-user">
                        <span class="user-name">user</span>
                        <span>сегодня</span>
                    </div>
                    <div class="card-title">Видеозапись</div>
                    <div class="card-stats">
                        <span>👁 100</span>
                        <span>❤️ 15</span>
                        <span>💬 3</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
