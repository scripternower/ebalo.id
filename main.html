<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка как на фото</title>
    <style>
        /* Сброс стилей по умолчанию */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Задний фон всей страницы */
        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* --- Основной контейнер карточки --- */
        .card {
            width: 380px; /* Ширина как на фото */
            background-color: #1f1f1f; /* Темный фон карточки */
            border-radius: 12px;
            overflow: hidden; /* Чтобы элементы не вылезали за закругленные углы */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* --- Контейнер для псевдо-видео-плеера --- */
        .video-thumbnail {
            position: relative; /* Чтобы размещать элементы внутри него абсолютно */
            width: 100%;
            height: 480px; /* Высота, похожая на фото */
            background-color: #000000; /* Черный фон для "видео" */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Элементы внутри псевдо-плеера (абсолютное позиционирование) --- */

        /* 1. Верхняя панель пользователя */
        .player-top-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Иконка пользователя (зеленый круг с лягушкой) */
        .user-icon {
            width: 32px;
            height: 32px;
            background-color: #43a047; /* Зеленый цвет */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
        }

        /* Текст имени пользователя */
        .user-name {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        /* 2. Центральная кнопка воспроизведения (красный треугольник) */
        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: #ff0000; /* Красный цвет */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
        /* Стрелка внутри кнопки */
        .play-button::after {
            content: "▶";
            position: relative;
            left: 3px; /* Смещаем стрелку в центр */
        }

        /* 3. Нижняя шкала прогресса */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background-color: #ffffff; /* Белая линия */
        }

        /* 4. Текст "Комментариев" и время (над шкалой) */
        .player-bottom-content {
            position: absolute;
            bottom: 30px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #ffffff;
            font-size: 16px;
            background-color: rgba(0, 0, 0, 0.5); /* Полупрозрачный фон */
            padding: 5px 10px;
            border-radius: 5px;
        }
        .time-icon {
            opacity: 0.7;
        }
        .comments-text {
            font-weight: 500;
        }

        /* --- Контент под видео --- */
        .card-content {
            padding: 15px 20px 20px 20px;
        }

        /* Верхняя строка: user и дата */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .meta-user {
            font-weight: bold;
            color: #ffffff;
        }

        /* Заголовок "Видеозапись" */
        .content-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }

        /* Статистика: просмотры, лайки, комментарии */
        .content-stats {
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* Иконки для статистики */
        .icon {
            font-size: 14px;
        }
        .icon.red {
            color: #ef5350; /* Красный для лайка */
        }

    </style>
</head>
<body>

    <!-- Карточка -->
    <div class="card">
        <!-- Псевдо-видео-плеер (самый сложный блок) -->
        <div class="video-thumbnail">
            <!-- Верхняя панель (иконка лягушки) -->
            <div class="player-top-panel">
                <div class="user-icon">🐸</div>
                <div class="user-name">Тучный Жа6</div>
            </div>

            <!-- Центральная кнопка Play -->
            <div class="play-button"></div>

            <!-- Нижняя панель (над шкалой) -->
            <div class="player-bottom-content">
                <span class="time-icon">🕒</span>
                <span class="comments-text">Комментариев</span>
            </div>

            <!-- Шкала прогресса -->
            <div class="progress-bar"></div>
        </div>

        <!-- Контент под видео -->
        <div class="card-content">
            <div class="content-header">
                <span class="meta-user">user</span>
                <span class="meta-date">сегодня</span>
            </div>
            <h2 class="content-title">Видеозапись</h2>
            <div class="content-stats">
                <div class="stat-item"><span class="icon">👁</span> 100</div>
                <div class="stat-item"><span class="icon red">❤️</span> 15</div>
                <div class="stat-item"><span class="icon">💬</span> 3</div>
            </div>
        </div>
    </div>

</body>
</html>
